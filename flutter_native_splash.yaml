# Regenerated from assets/branding/ via:
#   dart run flutter_native_splash:create
#
# Color matches AppTheme.splashCanvas in both polarities on purpose: the
# splash is a dark brand moment and splash_logo.png is drawn for a black
# backdrop, so a light variant would need a second asset. The app itself
# defaults to Light (docs/00_PRODUCT.md), so expect black → paper on the
# handoff; keeping native and Flutter splash identical means there is only
# ever one such transition instead of two.
flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: assets/branding/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: assets/branding/splash_logo.png
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"
